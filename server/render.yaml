services:
  - type: web
    name: tgms-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false        # set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true # Render auto-generates a secure random string
      - key: CLIENT_ORIGIN
        sync: false        # set to your Vercel frontend URL
      - key: PORT
        value: 10000
