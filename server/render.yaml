# Render Blueprint — Infrastructure as Code for TGMS backend.
# Deploy this repo on Render → it auto-creates the web service + PostgreSQL DB.
#
# How to use:
#   1. Push this file to GitHub (in server/ or repo root).
#   2. Go to https://dashboard.render.com/blueprints → "New Blueprint Instance".
#   3. Connect your GitHub repo → Render reads this file and provisions everything.
#   4. Fill the env vars (or set them manually after creation — see checklist below).

services:
  - type: web
    name: tgms-api
    runtime: node
    plan: free                    # upgrade to "starter" ($7/mo) for no spin-down
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: tgms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true       # Render creates a long random string automatically
      - key: CLIENT_ORIGIN
        sync: false               # you'll set this to your Vercel URL manually
      - key: COOKIE_DOMAIN
        sync: false               # optional — set only if scoping cookie to exact host

databases:
  - name: tgms-db
    plan: free                    # 90-day expiry; use "starter" ($15/mo) for permanence
    databaseName: tgms
    user: tgms
